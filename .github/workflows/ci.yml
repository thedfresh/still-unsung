# CI: runs on every pull request and every push to main.
# Builds (type check + lint + Next build), runs the unit and database tests against a
# throwaway Postgres 18, then the Playwright + axe checks at phone, tablet and desktop widths.
#
# CI deliberately runs on every change, docs included: it's free on a public repo, and a
# required check that is skipped would block docs-only PRs once branch protection is on.
# Skipping work for docs-only changes belongs to the deploy workflow (HSA-21).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: still_unsung
          POSTGRES_PASSWORD: still_unsung
          POSTGRES_DB: still_unsung_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U still_unsung -d still_unsung_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Throwaway database that exists only for this run. Not a secret.
      DATABASE_URL: postgresql://still_unsung:still_unsung@localhost:5432/still_unsung_test
      CI: "true"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations from scratch
        run: npx prisma migrate deploy

      - name: Build (type check, lint, Next build)
        run: npm run build

      - name: Unit and database tests
        run: npm test

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Playwright and accessibility tests
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            test-results/
            playwright-report/
          retention-days: 7
