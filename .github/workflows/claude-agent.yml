# Claude agent: works one Jira ticket per run, and answers @claude on pull requests.
#
# Ticket runs start by hand (Actions → "Claude agent" → Run workflow, with a Jira key) or,
# once HSA-25 lands, from Jira through repository_dispatch. Each run:
#   1. checks out main, plus the private planning repo read-only into reference/ (never committed)
#   2. lets Claude claim the ticket (In Progress), do the work on branch hsa-<n> with tests,
#      commit, and write the PR description
#   3. pushes the branch and opens the PR with the Claude GitHub App's token (so CI runs and the
#      PR comes from the app, not a person)
#   4. lets Claude move the ticket to In Review with the PR link
#
# Guard rails: never pushes to main (branch protection also blocks it), never merges, never
# deploys, never touches the production database. Setup: docs/agent-workflow.md.
name: Claude agent

on:
  workflow_dispatch:
    inputs:
      ticket:
        description: "Jira key of a Ready ticket assigned to Claude, e.g. HSA-42"
        required: true
  repository_dispatch:
    types: [jira-ticket-ready]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  ticket:
    name: Work a Jira ticket
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Same image as CI: Node 26, git, Chromium and its libraries are already in it, so setup
    # never waits on Ubuntu's package servers. Keep the tag in step with @playwright/test.
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --init --ipc=host
    defaults:
      run:
        shell: bash
    # One ticket at a time; a second request waits instead of cancelling the first.
    concurrency:
      group: claude-agent-ticket
      cancel-in-progress: false

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: still_unsung
          POSTGRES_PASSWORD: still_unsung
          POSTGRES_DB: still_unsung_test
        options: >-
          --health-cmd "pg_isready -U still_unsung -d still_unsung_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TICKET: ${{ inputs.ticket || github.event.client_payload.ticket }}
      # Throwaway database for this run only. Not a secret.
      DATABASE_URL: postgresql://still_unsung:still_unsung@postgres:5432/still_unsung_test

    steps:
      - name: Validate the ticket key
        run: |
          if [[ ! "$TICKET" =~ ^HSA-[0-9]+$ ]]; then
            echo "::error::Not a valid Jira key: '$TICKET'"; exit 1
          fi
          echo "BRANCH=hsa-${TICKET#HSA-}" >> "$GITHUB_ENV"

      # The workflow's own commit: main for real runs (dispatch from main, or Jira), or a
      # workflow-fix branch when testing a change to this file with --ref.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Fail if the branch already exists
        run: |
          if git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null; then
            echo "::error::Branch $BRANCH already exists. Finish or delete it before re-running."; exit 1
          fi

      - name: Check out the planning repo read-only into reference/
        uses: actions/checkout@v7
        with:
          repository: thedfresh/hunter-setlist-archive
          token: ${{ secrets.REFERENCE_REPO_TOKEN }}
          path: reference
          persist-credentials: false

      - name: Keep reference/ out of commits
        run: echo "reference/" >> .git/info/exclude

      - name: Set up the app
        uses: ./.github/actions/setup
        timeout-minutes: 5

      - name: Start the ticket branch
        run: git checkout -b "$BRANCH"

      - name: Prepare the Claude step (Bun from npm, Jira MCP config signed in as Claude)
        timeout-minutes: 3
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_CLAUDE_EMAIL }}
          JIRA_TOKEN: ${{ secrets.JIRA_MCP_CLAUDE_TOKEN }}
        run: |
          # The action's own Bun download needs unzip, which the image lacks; npm has Bun too.
          npm install -g --no-audit --no-fund bun@1.4.4
          echo "BUN_PATH=$(command -v bun)" >> "$GITHUB_ENV"
          node -e '
            const auth = "Basic " + Buffer.from(process.env.JIRA_EMAIL + ":" + process.env.JIRA_TOKEN).toString("base64");
            const config = { mcpServers: { jira: { type: "http", url: "https://mcp.atlassian.com/v2/mcp", headers: { Authorization: auth } } } };
            require("fs").writeFileSync(process.env.RUNNER_TEMP + "/mcp.json", JSON.stringify(config));
          '

      - name: Claude works the ticket
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          path_to_bun_executable: ${{ env.BUN_PATH }}
          prompt: |
            You are the Claude agent for the StillUnsung rebuild. Work Jira ticket ${{ env.TICKET }}
            in this repository (thedfresh/still-unsung), on the branch already checked out: ${{ env.BRANCH }}.

            Rules (also in reference/CLAUDE.md → "Jira workflow"; read it first, and reference/PLAN.md
            for decisions; reference/ is the private planning repo plus the old app, read-only):
            - Jira site dfresh.atlassian.net, project HSA. Use the jira MCP tools; you are signed in as
              the Jira user "Claude".
            - Only work the ticket if its status is Ready and it is assigned to Claude. Otherwise add a
              comment saying why, make no changes, and stop.
            - First move the ticket to In Progress (transition "In Progress"). Never move it to Done,
              never change its assignee.
            - Do exactly what the ticket asks, in one pass. If it can't be done without a decision from
              the user, comment one clear question on the ticket and stop without committing.
            - Follow README.md and the repo's conventions. Run `npm run build` and `npm test`; run
              `npm run test:e2e` when pages change. Everything must pass before you commit.
            - Commit on ${{ env.BRANCH }} only. Commit messages end with "Refs: ${{ env.TICKET }}".
              Do not push, do not create a pull request: the workflow does both after you finish.
            - Never commit anything from reference/, secrets, production data or private research
              material: this repository is public.
            - Write the pull request description to ${{ runner.temp }}/pr-body.md with the sections
              "What changed and why", "What to check" (exact steps), "Migration or risk", and a last
              line "Refs: ${{ env.TICKET }}". Do not move the ticket to In Review; a later step does.
          claude_args: |
            --mcp-config ${{ runner.temp }}/mcp.json
            --max-turns 200
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(npm:*),Bash(npx:*),Bash(node:*),Bash(git add:*),Bash(git commit:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(ls:*),Bash(cat:*),mcp__jira__getJiraIssue,mcp__jira__searchJiraIssuesUsingJql,mcp__jira__transitionJiraIssue,mcp__jira__addOrEditJiraIssueComment"

      # The action reports success even when it skips itself (for example when this file differs
      # from main's copy, which it requires before handing out the app token). Fail loudly instead.
      - name: Fail if Claude didn't run
        if: steps.claude.outputs.github_token == ''
        run: |
          echo "::error::The Claude step skipped itself or got no app token; see its log. The workflow file must match main's copy."; exit 1

      - name: Push the branch
        id: push
        timeout-minutes: 3
        env:
          APP_TOKEN: ${{ steps.claude.outputs.github_token }}
        run: |
          if [ -z "$(git log --oneline "${{ github.sha }}..HEAD")" ]; then
            echo "No commits on $BRANCH; nothing to push (see the ticket for Claude's comment)."
            echo "pushed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ ! -s "$RUNNER_TEMP/pr-body.md" ]; then
            printf 'Work for %s.\n\nRefs: %s\n' "$TICKET" "$TICKET" > "$RUNNER_TEMP/pr-body.md"
          fi
          git push "https://x-access-token:${APP_TOKEN}@github.com/${{ github.repository }}.git" "$BRANCH"
          echo "title=$TICKET: $(git log -1 --format=%s)" >> "$GITHUB_OUTPUT"
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Open the pull request (as the Claude GitHub App)
        id: pr
        if: steps.push.outputs.pushed == 'true'
        timeout-minutes: 2
        uses: actions/github-script@v9
        env:
          TITLE: ${{ steps.push.outputs.title }}
        with:
          github-token: ${{ steps.claude.outputs.github_token }}
          result-encoding: string
          script: |
            const fs = require("fs");
            const { data } = await github.rest.pulls.create({
              ...context.repo,
              base: "main",
              head: process.env.BRANCH,
              title: process.env.TITLE,
              body: fs.readFileSync(process.env.RUNNER_TEMP + "/pr-body.md", "utf8"),
            });
            core.info(`Opened ${data.html_url}`);
            return data.html_url;

      - name: Move the ticket to In Review with the PR link
        if: steps.pr.outputs.result != ''
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          path_to_bun_executable: ${{ env.BUN_PATH }}
          prompt: |
            In Jira (site dfresh.atlassian.net), for ticket ${{ env.TICKET }}: add a comment
            "PR open for review: ${{ steps.pr.outputs.result }}" with a two-line summary of what the PR
            changes, then move the ticket to In Review (transition "In Review"). Do nothing else.
          claude_args: |
            --mcp-config ${{ runner.temp }}/mcp.json
            --max-turns 10
            --allowedTools "mcp__jira__getJiraIssue,mcp__jira__transitionJiraIssue,mcp__jira__addOrEditJiraIssueComment,Bash(git log:*)"

  respond:
    name: Answer @claude on a pull request
    # The action itself only runs for users with write access to the repo.
    if: |
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Same image as CI: Node 26, git, Chromium and its libraries are already in it, so setup
    # never waits on Ubuntu's package servers. Keep the tag in step with @playwright/test.
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --init --ipc=host
    defaults:
      run:
        shell: bash

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: still_unsung
          POSTGRES_PASSWORD: still_unsung
          POSTGRES_DB: still_unsung_test
        options: >-
          --health-cmd "pg_isready -U still_unsung -d still_unsung_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://still_unsung:still_unsung@postgres:5432/still_unsung_test

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 20

      - name: Set up the app
        uses: ./.github/actions/setup
        timeout-minutes: 5

      - name: Install Bun from npm (the action's own download needs unzip, which the image lacks)
        timeout-minutes: 3
        run: |
          npm install -g --no-audit --no-fund bun@1.4.4
          echo "BUN_PATH=$(command -v bun)" >> "$GITHUB_ENV"

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          path_to_bun_executable: ${{ env.BUN_PATH }}
          claude_args: |
            --max-turns 100
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(npm:*),Bash(npx:*),Bash(node:*),Bash(git add:*),Bash(git commit:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*)"
