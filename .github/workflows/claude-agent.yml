# Claude agent: works one Jira ticket per run, and answers @claude on pull requests.
#
# Ticket runs start automatically when a ticket assigned to Claude moves to Ready (a Jira
# Automation rule sends repository_dispatch; docs/agent-workflow.md), or by hand from Actions. Each run:
#   1. checks out main, plus the private planning repo's `planning` branch read-only into
#      /tmp/reference (outside the project, so it's never built, linted or committed)
#   2. lets Claude claim the ticket (In Progress), do the work on branch hsa-<n> with tests,
#      commit, write the PR description, push the branch and open the PR (scripts/open-pr.mjs),
#      all with the Claude GitHub App's token, so CI runs and the PR comes from the app
#   3. lets Claude move the ticket to In Review with the PR link
#
# Guard rails: never pushes to main (branch protection also blocks it), never merges, never
# deploys, never touches the production database. Setup: docs/agent-workflow.md.
name: Claude agent

on:
  workflow_dispatch:
    inputs:
      ticket:
        description: "Jira key of a Ready ticket assigned to Claude, e.g. HSA-42"
        required: true
      model:
        description: "Model for this run (Jira runs pick it from the ticket's labels instead)"
        type: choice
        options: [sonnet, opus, fable]
        default: sonnet
  repository_dispatch:
    types: [jira-ticket-ready]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  ticket:
    name: Work a Jira ticket
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Same image as CI: Node 26, git, Chromium and its libraries are already in it, so setup
    # never waits on Ubuntu's package servers. Keep the tag in step with @playwright/test.
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --init --ipc=host
    defaults:
      run:
        shell: bash
    # One ticket at a time; a second request waits instead of cancelling the first.
    concurrency:
      group: claude-agent-ticket
      cancel-in-progress: false

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: still_unsung
          POSTGRES_PASSWORD: still_unsung
          POSTGRES_DB: still_unsung_test
        options: >-
          --health-cmd "pg_isready -U still_unsung -d still_unsung_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TICKET: ${{ inputs.ticket || github.event.client_payload.ticket }}
      # Jira sends the ticket's labels (comma-separated); "fable" or "opus" picks a bigger model.
      LABELS: ${{ github.event.client_payload.labels }}
      MODEL_CHOICE: ${{ inputs.model }}
      # The user's Jira account, for the one mention in a hand-back or question (a repo variable,
      # so it isn't written in this public file).
      USER_JIRA_ID: ${{ vars.JIRA_USER_ACCOUNT_ID }}
      # Throwaway database for this run only. Not a secret.
      DATABASE_URL: postgresql://still_unsung:still_unsung@postgres:5432/still_unsung_test
      # Scratch files shared between steps (MCP config, PR description). A fixed path inside the
      # container: runner.temp expands to the host's path, which the container can't see.
      AGENT_TMP: /tmp/agent

    steps:
      - name: Validate the ticket key
        run: |
          if [[ ! "$TICKET" =~ ^HSA-[0-9]+$ ]]; then
            echo "::error::Not a valid Jira key: '$TICKET'"; exit 1
          fi
          echo "BRANCH=hsa-${TICKET#HSA-}" >> "$GITHUB_ENV"

      - name: Pick the model (label fable or opus on the ticket; Sonnet otherwise)
        run: |
          choice="${MODEL_CHOICE:-sonnet}"
          IFS=',' read -ra labels <<< "$(echo "$LABELS" | tr -d "[]" | tr "[:upper:]" "[:lower:]")"
          for label in "${labels[@]}"; do
            label="$(echo "$label" | xargs)"
            if [ "$label" = "fable" ]; then choice=fable; fi
            if [ "$label" = "opus" ] && [ "$choice" != "fable" ]; then choice=opus; fi
          done
          case "$choice" in
            fable) model=claude-fable-5-2 ;;
            opus)  model=claude-opus-5-5 ;;
            *)     model=claude-sonnet-5-5 ;;
          esac
          echo "MODEL=$model" >> "$GITHUB_ENV"
          echo "Model for $TICKET: $model"

      # The workflow's own commit: main for real runs (dispatch from main, or Jira), or a
      # workflow-fix branch when testing a change to this file with --ref.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      # A ticket that failed review comes back to Ready with its branch and PR still open: the run
      # then reworks that branch. A branch with no open PR (merged or abandoned) stops the run.
      - name: Check for earlier work on this ticket
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null; then
            echo "REWORK=false" >> "$GITHUB_ENV"
            echo "New work: $BRANCH starts from main."; exit 0
          fi
          pr=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/pulls?state=open&head=${{ github.repository_owner }}:$BRANCH" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s)[0]?.html_url ?? ""))')
          if [ -z "$pr" ]; then
            echo "::error::Branch $BRANCH exists but has no open pull request. Delete it (or reopen its PR) before re-running."; exit 1
          fi
          echo "REWORK=true" >> "$GITHUB_ENV"
          echo "PR_URL=$pr" >> "$GITHUB_ENV"
          {
            echo "REWORK_NOTE<<EOF_NOTE"
            echo "REWORK AFTER REVIEW. These instructions replace the push and PR steps below."
            echo "This ticket failed the user's review. Branch $BRANCH and its pull request ($pr) already"
            echo "exist, and the branch is checked out. Read the ticket's comments since your last hand-back"
            echo "(and the PR's comments): they hold the review. Fix what the review asks, on this branch."
            echo "Run the checks, commit, then run git push origin $BRANCH. Do NOT run scripts/open-pr.mjs:"
            echo "the pull request exists. In the executive summary, say what the review asked and what"
            echo "you changed in response."
            echo "EOF_NOTE"
          } >> "$GITHUB_ENV"
          echo "Rework: $BRANCH has open PR $pr."

      - name: Start the ticket branch
        run: |
          if [ "$REWORK" = "true" ]; then
            git fetch origin "$BRANCH"
            git checkout -b "$BRANCH" "origin/$BRANCH"
          else
            git checkout -b "$BRANCH"
          fi
          echo "START_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      # Branch `planning` holds the current CLAUDE.md, PLAN.md and docs (its main is the frozen
      # old app and deploys on push, so planning commits live on this branch until cutover).
      - name: Check out the planning repo read-only
        uses: actions/checkout@v7
        with:
          repository: thedfresh/hunter-setlist-archive
          ref: planning
          token: ${{ secrets.REFERENCE_REPO_TOKEN }}
          path: reference
          persist-credentials: false

      # checkout can only write inside the workspace; move it out so the type checker, linter
      # and tests never see it and it can't be committed.
      - name: Move the planning repo out of the project, to /tmp/reference
        run: mv reference /tmp/reference

      - name: Set up the app
        uses: ./.github/actions/setup
        timeout-minutes: 5

      - name: Prepare the Claude step (Bun from npm, Jira MCP config signed in as Claude)
        timeout-minutes: 3
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_CLAUDE_EMAIL }}
          JIRA_TOKEN: ${{ secrets.JIRA_MCP_CLAUDE_TOKEN }}
        run: |
          # The action's own Bun download needs unzip, which the image lacks; npm has Bun too.
          npm install -g --no-audit --no-fund bun@1.4.4
          echo "BUN_PATH=$(command -v bun)" >> "$GITHUB_ENV"
          node scripts/write-jira-mcp-config.mjs

      - name: Claude works the ticket
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          path_to_bun_executable: ${{ env.BUN_PATH }}
          prompt: |
            You are the Claude agent for the StillUnsung rebuild. Work Jira ticket ${{ env.TICKET }}
            in this repository (thedfresh/still-unsung), on the branch already checked out: ${{ env.BRANCH }}.

            ${{ env.REWORK_NOTE }}

            Rules (also in /tmp/reference/CLAUDE.md → "Jira workflow"; read it first, and
            /tmp/reference/PLAN.md and /tmp/reference/docs/ for decisions and specs. /tmp/reference is
            the private planning repo plus the old app, read-only; its freeze rules are about the old
            app and don't apply to this repository):
            - Jira site dfresh.atlassian.net, project HSA. Use the jira MCP tools; you are signed in as
              the Jira user "Claude". If the jira tools are missing or fail, stop and say exactly that
              (tool names and error) in your final message.
            - Only work the ticket if its status is Ready and it is assigned to you (check your account
              with atlassianUserInfo; the Jira user is shown as "Claude Code"). Otherwise add a
              comment saying why, make no changes, and stop.
            - First move the ticket to In Progress (transition "In Progress"). Never move it to Done,
              never change its assignee.
            - Do exactly what the ticket asks, in one pass. If it can't be done without a decision from
              the user, comment one clear question on the ticket and stop without committing.
            - Follow README.md and the repo's conventions. Run `npm run build` and `npm test`; run
              `npm run test:e2e` when pages change. Everything must pass before you commit.
            - Commit on ${{ env.BRANCH }} only. Commit messages end with "Refs: ${{ env.TICKET }}".
            - Never copy private material from /tmp/reference into this repo, never commit secrets, production data or private research
              material: this repository is public.
            - Write an executive summary (rules below) to ${{ env.AGENT_TMP }}/summary.md. Then write the
              pull request description to ${{ env.AGENT_TMP }}/pr-body.md: the same summary first, then
              the sections "What changed and why", "What to check" (exact steps), "Migration or risk",
              and a last line "Refs: ${{ env.TICKET }}".
            - Last, only if you committed and everything passes: run `git push origin ${{ env.BRANCH }}`,
              then `node scripts/open-pr.mjs` (opens the PR from your description). Both must succeed;
              if either fails, put its exact error in your final message. Never push any other branch.
              If you open a PR, don't move the ticket to In Review yourself; a later step does.
            - If you finished the ticket without code (nothing to commit because the work is in Jira
              or is an answer), comment an executive summary of what you did and move the ticket to
              In Review (transition "In Review"). If you stopped to ask a question, leave it
              In Progress and comment an executive summary whose "Next step for you" is that one
              question. In Review always means: done, waiting for the user's check.

            Creating tickets (also in /tmp/reference/CLAUDE.md → "Jira workflow"):
            - Create Jira tickets only when the ticket you are working asks for them. Never create
              tickets on your own initiative; suggest them in your hand-back instead.
            - Each new ticket: project HSA, type Task, one discrete task with "Scope" and "Done when",
              under the right epic (parent), assigned to you (agent work; your account from
              atlassianUserInfo) or to the user (their own work; account ${{ env.USER_JIRA_ID }}).
            - New tickets stay in To Do. Never move a ticket you created to Ready.
            - List every ticket you created (key and title) in the hand-back's details, and say in
              "Next step for you" that they need "Move to board" and a review.

            Contacting the user (also in /tmp/reference/CLAUDE.md → "How agents contact the user"):
            - Jira is the only channel. Never email, message, or tag the user in GitHub.
            - Tag the user in exactly two kinds of comment: the hand-back for a ticket finished
              without code, and a question that needs their decision. Write those comments in HTML
              (contentFormat "html") and start them with this mention:
              <span data-type="mention" data-user-id="${{ env.USER_JIRA_ID }}">@Douglas</span>
              Then the executive summary, labels in <strong>. Tag nowhere else: not when you claim
              the ticket, and not in other comments. Ask one question per ticket, never a list.

            Writing rules (also in /tmp/reference/CLAUDE.md → "Writing style"; keep them in step):
            - Use ASD-STE100 (Simplified Technical English) as a guide, about 80%: short sentences
              (steps ≤20 words, descriptions ≤25), one idea per sentence, active voice, simple tenses,
              imperative for instructions, one word for one meaning, keep "the" and "a", no noun
              stacks of more than three words, lists for steps and for more than two parallel items.
            - Every hand-back comment and PR description starts with an executive summary for a
              reader who has read no other ticket, PR or doc: five labeled lines, one or two plain
              sentences each:
              **Question:** what we wanted to know or fix, and why it matters to the archive's readers
              or to the rebuild. **What I did:** the method, in everyday words. **What I found:** the
              answer, with at most two key numbers, and what it means. **What changed:** what you made,
              described by content, not by commit. **Next step for you:** the one action needed from
              the user (review and merge, or one decision), and what happens if they agree.
            - No ticket keys, file names, branch names or commit ids in the summary; explain any
              needed term in the same sentence. Those details go below the summary.
          claude_args: |
            --mcp-config ${{ env.AGENT_TMP }}/mcp.json
            --add-dir ${{ env.AGENT_TMP }}
            --add-dir /tmp/reference
            --model ${{ env.MODEL }}
            --max-turns 200
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(npm:*),Bash(npx:*),Bash(node:*),Bash(git add:*),Bash(git commit:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git push origin ${{ env.BRANCH }}),Bash(ls:*),Bash(cat:*),mcp__jira__atlassianUserInfo,mcp__jira__getJiraIssue,mcp__jira__searchJiraIssuesUsingJql,mcp__jira__transitionJiraIssue,mcp__jira__addOrEditJiraIssueComment,mcp__jira__createJiraIssue"

      # The action hides Claude's messages (full output would expose private /tmp/reference content in
      # this public repo's logs). Print only what's needed to see why a run ended.
      - name: Report how Claude's run ended
        if: always() && steps.claude.outputs.execution_file != ''
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          node -e '
            const msgs = JSON.parse(require("fs").readFileSync(process.env.EXECUTION_FILE, "utf8"));
            const init = msgs.find(m => m.type === "system" && m.subtype === "init") || {};
            const result = msgs.find(m => m.type === "result") || {};
            const tools = (init.tools || []).filter(t => t.startsWith("mcp__"));
            const lines = [
              "MCP servers: " + JSON.stringify(init.mcp_servers || "not reported"),
              "Jira tools available: " + (tools.length ? tools.join(", ") : "none"),
              "Model: " + (init.model || process.env.MODEL),
              "Turns: " + result.num_turns + ", error: " + result.is_error,
              "Final message: " + String(result.result || "").slice(0, 1500),
            ];
            console.log(lines.join("\n"));
            require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, "### Claude run\n```\n" + lines.join("\n") + "\n```\n");
          '

      # The action reports success even when it skips itself (for example when this file differs
      # from main's copy, which it requires before handing out the app token). Fail loudly instead.
      - name: Fail if Claude didn't run
        if: steps.claude.outputs.github_token == ''
        run: |
          echo "::error::The Claude step skipped itself or got no app token; see its log. The workflow file must match main's copy."; exit 1

      # Claude pushes and opens the PR itself (scripts/open-pr.mjs) while the app token is live:
      # the action withdraws that token when its step ends.
      - name: Find the pull request
        id: pr
        run: |
          if [ "$REWORK" = "true" ]; then
            if [ "$(git rev-parse HEAD)" != "$START_SHA" ]; then
              echo "url=$PR_URL" >> "$GITHUB_OUTPUT"
              echo "Reworked pull request: $PR_URL"
            else
              echo "::warning::Rework made no commits. See 'Report how Claude's run ended' and the ticket."
            fi
          elif [ -s "$AGENT_TMP/pr-url" ]; then
            echo "url=$(cat "$AGENT_TMP/pr-url")" >> "$GITHUB_OUTPUT"
            echo "Pull request: $(cat "$AGENT_TMP/pr-url")"
          elif [ -n "$(git log --oneline "${{ github.sha }}..HEAD")" ]; then
            echo "::error::Claude committed on $BRANCH but no PR was opened. See 'Report how Claude's run ended'."; exit 1
          else
            echo "::warning::No commits on $BRANCH and no PR. See 'Report how Claude's run ended' and the ticket."
          fi

      - name: Move the ticket to In Review with the PR link
        if: steps.pr.outputs.url != ''
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          path_to_bun_executable: ${{ env.BUN_PATH }}
          prompt: |
            In Jira (site dfresh.atlassian.net), for ticket ${{ env.TICKET }}: read
            ${{ env.AGENT_TMP }}/summary.md and add one comment in HTML (contentFormat "html"):
            first this mention, which notifies the user:
            <span data-type="mention" data-user-id="${{ env.USER_JIRA_ID }}">@Douglas</span>
            then that executive summary with the same words (one <p> per labeled line, labels in
            <strong>), then a paragraph "Pull request: " with the link ${{ steps.pr.outputs.url }}.
            If the file is missing, write a five-line executive summary from the PR description in
            ${{ env.AGENT_TMP }}/pr-body.md instead. Tag the user only in this comment. Then move the ticket to In Review (transition
            "In Review"). Do nothing else.
          claude_args: |
            --mcp-config ${{ env.AGENT_TMP }}/mcp.json
            --add-dir ${{ env.AGENT_TMP }}
            --max-turns 10
            --allowedTools "Read,mcp__jira__getJiraIssue,mcp__jira__transitionJiraIssue,mcp__jira__addOrEditJiraIssueComment"

  respond:
    name: Answer @claude on a pull request
    # The action itself only runs for users with write access to the repo.
    if: |
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Same image as CI: Node 26, git, Chromium and its libraries are already in it, so setup
    # never waits on Ubuntu's package servers. Keep the tag in step with @playwright/test.
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --init --ipc=host
    defaults:
      run:
        shell: bash

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: still_unsung
          POSTGRES_PASSWORD: still_unsung
          POSTGRES_DB: still_unsung_test
        options: >-
          --health-cmd "pg_isready -U still_unsung -d still_unsung_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://still_unsung:still_unsung@postgres:5432/still_unsung_test
      AGENT_TMP: /tmp/agent

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 20

      - name: Set up the app
        uses: ./.github/actions/setup
        timeout-minutes: 5

      - name: Prepare the Claude step (Bun from npm, Jira MCP config signed in as Claude)
        timeout-minutes: 3
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_CLAUDE_EMAIL }}
          JIRA_TOKEN: ${{ secrets.JIRA_MCP_CLAUDE_TOKEN }}
        run: |
          # The action's own Bun download needs unzip, which the image lacks; npm has Bun too.
          npm install -g --no-audit --no-fund bun@1.4.4
          echo "BUN_PATH=$(command -v bun)" >> "$GITHUB_ENV"
          node scripts/write-jira-mcp-config.mjs

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          path_to_bun_executable: ${{ env.BUN_PATH }}
          # Keep the Jira ticket in step: after the fix, a short note on the ticket named in the PR's
          # "Refs:" line. No tag and no status change; the ticket's hand-back stays the summary.
          claude_args: |
            --mcp-config ${{ env.AGENT_TMP }}/mcp.json
            --max-turns 100
            --append-system-prompt "After you push your fix, find the Jira key in the pull request description's 'Refs: HSA-n' line. Add one short comment to that ticket (Jira site dfresh.atlassian.net, jira MCP tools) that starts 'Fix from a PR comment:', says in one or two plain sentences what was asked and what you changed, and ends with the pull request link. Do not tag the user and do not change the ticket's status. If there is no Refs line, skip this."
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(npm:*),Bash(npx:*),Bash(node:*),Bash(git add:*),Bash(git commit:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),mcp__jira__getJiraIssue,mcp__jira__addOrEditJiraIssueComment"
